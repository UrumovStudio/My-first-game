
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Racing 5.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:14px;left:13px;padding:12px 17px;background:#07101bdc;border:1px solid #ffffff35;border-radius:15px;line-height:1.8;font-size:15px}
#hud b{color:#ffcf66}
#logo{position:absolute;right:15px;top:17px;font-weight:bold;font-size:19px;text-shadow:0 2px 8px #000}
#controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-around;align-items:center}
.ctrl{width:76px;height:76px;border-radius:50%;border:2px solid #ffffffaa;background:#101b;color:white;font-size:34px;touch-action:none}
#gas{width:96px;height:96px;background:#c51d25dd;font-size:19px;font-weight:bold}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#07101bd9}
#panel{background:#111d2beF;padding:30px 22px;border-radius:22px;border:1px solid #ffffff44;width:85%;max-width:370px}
#panel h1{color:#ff4141}
#panel button{background:#df2525;color:white;border:0;border-radius:10px;padding:15px 40px;font-size:20px;font-weight:bold}
#hint{position:absolute;bottom:126px;text-align:center;width:100%;font-size:12px;color:#ffffffaa}
</style>
</head>
<body>

<div id="hud">
 <b>🏁 3D RACING 5.0</b><br>
 SPEED: <b id="speed">0</b> km/h<br>
 SCORE: <b id="score">0</b>
</div>
<div id="logo">REALISTIC CITY</div>
<div id="hint">Задръж ГАЗ и използвай стрелките</div>

<div id="controls">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="gas">ГАЗ</button>
 <button class="ctrl" id="right">▶</button>
</div>

<div id="start">
 <div id="panel">
  <h1>3D RACING 5.0</h1>
  <p>SMOOTH CITY EDITION</p>
  <p>Нова каросерия · Асфалтова текстура · Градски пейзаж</p>
  <button onclick="startGame()">START RACE</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,car;
let speed=0,score=0,running=false;
let steering=0,lastTime=0;
const keys={left:false,right:false,gas:false};
const buildings=[],lines=[],traffic=[],wheels=[];

const mat=(color,rough=.5,metal=.1,emissive=0)=>
 new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive});

function roundedTexture(){
 const c=document.createElement('canvas');
 c.width=512;c.height=512;
 const x=c.getContext('2d');

 x.fillStyle='#292c30';
 x.fillRect(0,0,512,512);

 // Asphalt grain
 for(let i=0;i<16000;i++){
  const n=Math.random();
  x.fillStyle=n>.5?'#414347':'#171a1e';
  x.globalAlpha=.12+Math.random()*.2;
  x.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*3,1+Math.random()*2);
 }
 x.globalAlpha=1;

 // Small asphalt repairs
 for(let i=0;i<22;i++){
  x.fillStyle='#202327';
  x.globalAlpha=.4;
  x.beginPath();
  x.ellipse(Math.random()*512,Math.random()*512,5+Math.random()*25,3+Math.random()*12,Math.random(),0,Math.PI*2);
  x.fill();
 }
 x.globalAlpha=1;

 const t=new THREE.CanvasTexture(c);
 t.wrapS=t.wrapT=THREE.RepeatWrapping;
 t.repeat.set(2,22);
 t.anisotropy=2;
 return t;
}

function windowTexture(){
 const c=document.createElement('canvas');
 c.width=128;c.height=256;
 const x=c.getContext('2d');
 x.fillStyle='#273b50';x.fillRect(0,0,128,256);
 for(let a=5;a<128;a+=24){
  for(let b=5;b<256;b+=29){
   x.fillStyle=Math.random()>.35?'#e7c995':'#688da7';
   x.globalAlpha=.5+Math.random()*.5;
   x.fillRect(a,b,15,20);
  }
 }
 x.globalAlpha=1;
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBEncoding;
 return t;
}

const roadMat=new THREE.MeshStandardMaterial({
 map:roundedTexture(),roughness:.72,metalness:.12
});
const windows=windowTexture();

function ellipsoid(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),material);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 parent.add(m);
 return m;
}

function box(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

function createCar(){
 const g=new THREE.Group();

 const red=mat(0xc90018,.22,.65);
 const dark=mat(0x111820,.2,.5);
 const glass=mat(0x142a3a,.15,.6);
 const rubber=mat(0x08090b,.9);
 const silver=mat(0xaeb9c4,.25,.9);

 // Rounded main body
 ellipsoid(g,0,.83,0,1.08,.39,2.18,red);
 ellipsoid(g,0,.98,-1.15,.98,.27,1.03,red);
 ellipsoid(g,0,.99,1.25,1,.26,.9,red);

 // Smooth cabin
 ellipsoid(g,0,1.39,.05,.79,.62,1.12,glass);

 // Roof
 ellipsoid(g,0,1.88,.02,.72,.12,.91,dark);

 // Side panels
 for(const s of [-1,1]){
  ellipsoid(g,s*.93,.85,0,.16,.28,1.7,red);
  box(g,s*.79,1.39,.05,.06,.38,1.25,dark);
 }

 // Front bumper and grille
 ellipsoid(g,0,.65,-2.05,.9,.2,.17,dark);
 box(g,0,.72,-2.18,.95,.15,.07,mat(0x17191d));

 // Rear spoiler
 box(g,0,1.3,1.93,2,.1,.25,dark);
 box(g,-.7,1.19,1.85,.12,.2,.12,dark);
 box(g,.7,1.19,1.85,.12,.2,.12,dark);

 // Lights
 const tail=mat(0xff1010,.2,.2,0xff1010);
 for(const s of [-1,1]){
  ellipsoid(g,s*.68,.94,2.02,.3,.1,.09,tail);
  ellipsoid(g,s*.69,.99,-2.05,.25,.08,.07,mat(0xffffff,.2,.1,0xffffff));
 }

 // Four rounded wheels
 for(const x of [-1,1]){
  for(const z of [-1.35,1.35]){
   const w=new THREE.Group();

   const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(.43,.43,.29,24),
    rubber
   );
   tire.rotation.z=Math.PI/2;
   w.add(tire);

   const rim=new THREE.Mesh(
    new THREE.CylinderGeometry(.25,.25,.31,20),
    silver
   );
   rim.rotation.z=Math.PI/2;
   w.add(rim);

   w.position.set(x*1.02,.48,z);
   g.add(w);
   wheels.push(w);
  }
 }

 g.position.set(0,0,4);
 scene.add(g);
 return g;
}

function createBuilding(side,z){
 const h=17+Math.random()*28;
 const w=7+Math.random()*5;
 const d=8+Math.random()*7;
 const g=new THREE.Group();

 const wall=new THREE.MeshStandardMaterial({
  map:windows,roughness:.42,metalness:.3
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),wall
 );
 body.position.y=h/2;
 g.add(body);

 const roof=box(g,0,h+.2,0,w*.7,.4,d*.7,mat(0x273442,.4,.6));

 // Rounded roof structures
 ellipsoid(g,0,h+.7,0,w*.22,.6,d*.2,mat(0x35495a,.4,.5));

 g.position.set(side*(14+Math.random()*5),0,z);
 scene.add(g);
 buildings.push(g);
}

function createTraffic(){
 const g=new THREE.Group();
 ellipsoid(g,0,.8,0,.9,.4,1.75,mat(0x263e61,.3,.55));
 ellipsoid(g,0,1.27,-.1,.68,.48,.83,mat(0x172b3b,.2,.6));
 g.position.set((Math.random()-.5)*8,0,-80-Math.random()*180);
 scene.add(g);
 traffic.push(g);
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0xa39aa0);
 scene.fog=new THREE.Fog(0xb3a1a0,75,230);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
 camera.position.set(0,5.1,12);

 renderer=new THREE.WebGLRenderer({
  antialias:false,powerPreference:'high-performance'
 });
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1));
 renderer.outputEncoding=THREE.sRGBEncoding;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.2;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xe3eaff,0x51404c,2));

 const sun=new THREE.DirectionalLight(0xffc18b,2);
 sun.position.set(-30,50,-50);
 scene.add(sun);

 const sunBall=new THREE.Mesh(
  new THREE.SphereGeometry(8,16,12),
  new THREE.MeshBasicMaterial({color:0xffae69})
 );
 sunBall.position.set(-45,32,-180);
 scene.add(sunBall);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(300,450),
  mat(0x263d31)
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.set(0,-.12,-150);
 scene.add(ground);

 const road=new THREE.Mesh(
  new THREE.PlaneGeometry(16,450),
  roadMat
 );
 road.rotation.x=-Math.PI/2;
 road.position.set(0,0,-150);
 scene.add(road);

 // Lane markings
 for(let z=-340;z<30;z+=13){
  for(const x of [-2.65,2.65]){
   const l=box(scene,x,.045,z,.13,.025,5,mat(0xf3eee2));
   lines.push(l);
  }
 }

 // City
 for(let z=-320;z<20;z+=24){
  createBuilding(-1,z);
  createBuilding(1,z-12);
 }

 car=createCar();

 for(let i=0;i<4;i++)createTraffic();

 window.addEventListener('resize',resize);
 animate(performance.now());
}

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

function startGame(){
 document.getElementById('start').style.display='none';
 running=true;
 speed=0;score=0;
 lastTime=performance.now();
}

function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 const release=()=>keys[key]=false;
 el.addEventListener('pointerup',release);
 el.addEventListener('pointercancel',release);
 el.addEventListener('lostpointercapture',release);
}
bind('left','left');
bind('right','right');
bind('gas','gas');

window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')keys.left=true;
 if(e.key==='ArrowRight')keys.right=true;
 if(e.key==='ArrowUp')keys.gas=true;
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft')keys.left=false;
 if(e.key==='ArrowRight')keys.right=false;
 if(e.key==='ArrowUp')keys.gas=false;
});

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000||0,.035);
 lastTime=now;

 if(running){
  if(keys.gas)speed=Math.min(speed+38*dt,210);
  else speed=Math.max(speed-8*dt,0);

  const movement=speed/3.6*dt;

  let direction=0;
  if(keys.left)direction=-1;
  if(keys.right)direction=1;

  steering+=(direction-steering)*Math.min(1,dt*5);
  car.position.x+=steering*movement*.75;
  car.position.x=Math.max(-5.3,Math.min(5.3,car.position.x));

  car.rotation.z=-steering*.07;
  car.rotation.y=-steering*.1;

  wheels.forEach(w=>w.rotation.x-=movement*2);

  buildings.forEach(b=>{
   b.position.z+=movement;
   if(b.position.z>35)b.position.z=-335;
  });

  lines.forEach(l=>{
   l.position.z+=movement;
   if(l.position.z>20)l.position.z-=364;
  });

  traffic.forEach(t=>{
   t.position.z+=movement*.72;
   if(t.position.z>15){
    t.position.z=-170-Math.random()*100;
    t.position.x=(Math.random()-.5)*8;
   }
   if(Math.abs(t.position.z-car.position.z)<3 &&
      Math.abs(t.position.x-car.position.x)<1.8){
    speed=Math.max(0,speed-50*dt);
   }
  });

  score+=Math.floor(movement*3);
  document.getElementById('speed').textContent=Math.floor(speed);
  document.getElementById('score').textContent=score;
 }

 camera.position.x+=(car.position.x*.36-camera.position.x)*Math.min(1,dt*4);
 camera.lookAt(car.position.x*.65,1,-14);

 renderer.render(scene,camera);
}

init();
</script>
</body>
</html>
